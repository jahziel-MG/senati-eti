<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Senati ETI | Gestión de Visitas</title>

    <link rel="stylesheet" href="./Css/estilo.css">

    <!-- Librería para generar el código QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /* =========================================
           ENCABEZADO PERSONALIZADO
        ========================================= */

        .encabezado {
            width: 100%;
            min-height: 110px;
            padding: 0 7%;

            display: flex;
            align-items: center;

            background: #0d2942;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .encabezado-contenido {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;

            display: flex;
            align-items: center;
        }

        /* LOGO SENATI */

        .marca-senati {
            display: flex;
            align-items: center;
        }

        .marca-senati img {
            width: 130px;
            height: 80px;
            object-fit: contain;
            display: block;
        }

        /* LINEA VERTICAL */

        .separador-logo {
            width: 2px;
            height: 55px;

            background: #6685a3;

            margin-left: 28px;
            margin-right: 28px;
        }

        /* TITULO */

        .titulo-sistema {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .titulo-sistema h1 {
            margin: 0 0 5px 0;

            color: #ffffff;

            font-size: 30px;
            font-weight: 700;
        }

        .titulo-sistema span {
            color: #d6e2ee;
            font-size: 15px;
        }


        /* =========================================
           QR
        ========================================= */

        #codigoQR {
            width: 280px;
            height: 280px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #codigoQR img,
        #codigoQR canvas {
            width: 280px !important;
            height: 280px !important;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 700px) {

            .encabezado {
                padding: 15px 20px;
            }

            .marca-senati img {
                width: 100px;
                height: 65px;
            }

            .separador-logo {
                height: 45px;
                margin-left: 15px;
                margin-right: 15px;
            }

            .titulo-sistema h1 {
                font-size: 22px;
            }

            .titulo-sistema span {
                font-size: 12px;
            }
        }
    </style>

</head>


<body>


    <!-- =========================================
         ENCABEZADO
    ========================================= -->

    <header class="encabezado">

        <div class="encabezado-contenido">

            <!-- LOGO SENATI -->

            <div class="marca-senati">

                <img
                    src="./img/senati_logo.jpg"
                    alt="Logo SENATI"
                >

            </div>


            <!-- LINEA VERTICAL -->

            <div class="separador-logo"></div>


            <!-- TITULO DEL SISTEMA -->

            <div class="titulo-sistema">

                <h1>
                    Senati ETI
                </h1>

                <span>
                    Sistema de Gestión de Visitas
                </span>

            </div>

        </div>

    </header>



    <!-- =========================================
         CONTENIDO PRINCIPAL
    ========================================= -->

    <main class="contenido">

        <section class="tarjeta">


            <!-- ICONO -->

            <div class="icono-principal">
                +
            </div>


            <!-- TITULO -->

            <h2>
                Bienvenido
            </h2>


            <p class="descripcion">
                Registra tu visita de manera rápida y sencilla
            </p>


            <!-- =====================================
                 CÓDIGO QR
            ====================================== -->

            <div class="qr-box">

                <div id="codigoQR"></div>

            </div>


            <p class="texto-qr">
                📱 Escanea el código QR para registrar tu visita
            </p>


            <!-- =====================================
                 BOTÓN REGISTRAR
            ====================================== -->

            <button
                class="btn-registrar"
                onclick="registrarVisita()"
            >
                📋 Registrar visita
            </button>


            <!-- =====================================
                 ACCESOS
            ====================================== -->

            <div class="accesos">


                <!-- ADMINISTRADOR -->

                <a
                    href="login.html?rol=ADMIN"
                    class="btn-acceso"
                >

                    👑

                    <span>
                        Administrador
                    </span>

                </a>


                <!-- EMPLEADO -->

                <a
                    href="login.html?rol=EMPLEADO"
                    class="btn-acceso"
                >

                    👨‍💼

                    <span>
                        Empleado
                    </span>

                </a>


            </div>

        </section>

    </main>



    <!-- =========================================
         PIE DE PÁGINA
    ========================================= -->

    <footer class="pie">

        <p>
            Senati ETI © 2026
        </p>

        <span>
            Sistema de Gestión de Visitas
        </span>

    </footer>



    <!-- JAVASCRIPT EXISTENTE -->

    <script src="./js/app.js"></script>



    <!-- =========================================
         GENERAR QR
    ========================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const urlRegistro = "http://172.16.64.186:8081/senati-eti/registrar-visita.html";


                new QRCode(
                    document.getElementById("codigoQR"),
                    {

                        text: urlRegistro,

                        width: 280,
                        height: 280,

                        colorDark: "#000000",

                        colorLight: "#ffffff",

                        correctLevel:
                            QRCode.CorrectLevel.H

                    }
                );

            }
        );


        /* =========================================
           BOTÓN REGISTRAR VISITA
        ========================================= */

        function registrarVisita() {

            window.location.href =
                "registrar-visita.html";

        }

    </script>


</body>

</html>
